# Note: This is a composite GitHub Actions, it should do all env setup, caching an so on, so other pipelines can just compose their own stuff on top of that.
# Docs: https://docs.github.com/en/actions/creating-actions/creating-a-composite-action

name: Storm Software - Devenv Setup
description: "A composite action used by Storm Software repositories to setup a CI environment using [devenv](https://devenv.sh/)."
author: sullivanpj

branding:
  icon: play
  color: gray-dark

inputs:
  gpg-sign-key:
    description: GPG Sign Key
    required: true
  gpg-private-key:
    description: GPG Private Key
    required: true
  gpg-passphrase:
    description: GPG Passphrase
    required: true
  storm-bot-name:
    description: The username of the Storm bot
    required: true
    default: stormie-bot
  storm-bot-email:
    description: The email associated with the Storm bot
    required: true
    default: bot@stormsoftware.com
  storm-bot-github-token:
    description: The github token of the Storm bot
    required: true
  cachix-name:
    description: The cachix name
    required: true
    default: github-storm-software
  cachix-auth-token:
    description: The cachix auth token
    required: false

runs:
  using: composite
  steps:
    - name: Checkout [Pull Request]
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      if: ${{ github.event_name == 'pull_request' }}
      with:
        # By default, PRs will be checked-out based on the Merge Commit, but we want the actual branch HEAD.
        ref: ${{ github.event.pull_request.head.sha }}
        # We need to fetch all branches and commits so that Nx affected has a base to compare against.
        fetch-depth: 0
        token: ${{ inputs.storm-bot-github-token }}

    - name: Checkout `main` branch
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      if: ${{ github.event_name != 'pull_request' }}
      with:
        # We need to fetch all branches and commits so that Nx affected has a base to compare against.
        fetch-depth: 0
        token: ${{ inputs.storm-bot-github-token }}

    - name: Install and set up Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ inputs.storm-bot-github-token }}

    - name: Configures Nix to use the devenv cache
      uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17.0.0
      if: ${{ inputs.cachix-auth-token != '' }}
      with:
        name: ${{ inputs.cachix-name }}
        authToken: ${{ inputs.cachix-auth-token }}

    - name: Install devenv
      run: nix profile install nixpkgs#devenv
      shell: bash

    - name: Setup GPG
      uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
      with:
        gpg_private_key: ${{ inputs.gpg-private-key }}
        passphrase: ${{ inputs.gpg-passphrase }}
        git_config_global: true
        git_user_signingkey: true
        git_commit_gpgsign: true
        git_tag_gpgsign: true
        git_committer_name: ${{ inputs.storm-bot-name }}
        git_committer_email: ${{ inputs.storm-bot-email }}

    - name: Configure git
      run: |
        git config commit.gpgsign true
        git config tag.gpgSign true
        git config lfs.allowincompletepush true
        git config init.defaultBranch main
      shell: bash

    - name: Configure npm
      run: |
        npm config set //registry.npmjs.org/:_authToken=$NPM_TOKEN
        npm config set provenance true
      shell: bash
